[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ownmem"
version = "0.7.0"
description = "OwnMem — 你的 agent 的记忆，归你。可审计、可隐身、可抹除的 agent 记忆控制层"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "memory", "mcp", "privacy", "incognito", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ownmem/ownmem"

[project.scripts]
ownmem = "ownmem.cli:main"
ownmem-mcp = "ownmem.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ownmem*"]
